<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPLBP e-BILIK | Sistem Pengurusan Tempahan Bilik Mesyuarat</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind) {
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                mplbp: {
                  50: '#f0f7ff',
                  100: '#e0effe',
                  200: '#bae0fd',
                  300: '#7cc7fb',
                  400: '#38aaf7',
                  500: '#0e8ee9',
                  600: '#0270c7',
                  700: '#0359a1',
                  800: '#074c85',
                  900: '#0c406e',
                  950: '#082949'
                }
              },
              fontFamily: {
                sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              }
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; background-color: #0f172a; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-800 antialiased min-h-screen">
    
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px;">🏛️ MPLBP e-BILIK</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Sistem Pengurusan Tempahan Bilik Mesyuarat</p>
      </div>
    </div>

    <!-- Standalone Self-Contained Bundle (Includes React 18, ReactDOM 18 & Full App) -->
    <script src="app.bundle.js"></script>
  </body>
</html>
